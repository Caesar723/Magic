<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/webpages/page-transition.css">
    <script src="/webpages/page-transition.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#54777a">
    <title>Sign In · Magic</title>
    <link rel="icon" href="/webpages/homepage/coin.png">
    <link rel="stylesheet" href="/webpages/loginpage/login.css">
    <script defer src="/webpages/loginpage/login.js"></script>
    <script defer src="/webpages/loginpage/login-gallery.js"></script>
</head>
<body>
    <svg class="symbols" aria-hidden="true"><defs>
        <symbol id="compass" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><path d="m24 3 5 16 16 5-16 5-5 16-5-16L3 24l16-5Z"/></symbol>
        <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
        <filter id="engraved-image" color-interpolation-filters="sRGB">
            <feColorMatrix type="saturate" values="0" result="gray"/>
            <feConvolveMatrix in="gray" order="3" kernelMatrix="-1 -1 0 -1 0 1 0 1 1" divisor="2" bias="0.5" edgeMode="duplicate" result="cut"/>
            <feBlend in="gray" in2="cut" mode="multiply"/>
            <feComponentTransfer><feFuncR type="linear" slope=".83" intercept=".14"/><feFuncG type="linear" slope=".83" intercept=".14"/><feFuncB type="linear" slope=".80" intercept=".14"/></feComponentTransfer>
        </filter>
    </defs></svg>
    <div class="world" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"><div class="cloud cloud-near"></div><div class="cloud cloud-far"></div><div id="motes"></div></div>
    <header class="login-header">
        <a class="brand" href="/login" aria-label="Magic home">
            <svg viewBox="0 0 60 76" aria-hidden="true"><path d="M5 3h50v52L30 71 5 55Z" fill="#354e55"/><path d="M11 9h38v43L30 64 11 52Z" fill="none" stroke="#d9cba7" stroke-width="2"/><path d="m30 15 4 18 14 5-14 4-4 16-4-16-14-4 14-5Z" fill="#d9cba7"/><circle cx="30" cy="38" r="12" fill="none" stroke="#d9cba7"/></svg>
            <span>MAGIC</span>
        </a>
        <button id="motionToggle" class="text-button" type="button" aria-pressed="false">Motion: On</button>
    </header>
    <main class="login-layout">
        <section class="login-panel" aria-labelledby="loginTitle">
            <div class="panel-crown" aria-hidden="true"><span></span><svg><use href="#compass"/></svg><span></span></div>
            <div class="login-sheet">
                <h1 id="loginTitle">Sign In</h1>
                <form method="POST" class="form login" id="itemForm" aria-describedby="message_confirm">
                    <div class="form-field">
                        <label for="login__username">Username</label>
                        <input autocomplete="username" id="login__username" type="text" name="username" placeholder="Your username" minlength="3" required autocapitalize="none" spellcheck="false" aria-describedby="message_confirm">
                    </div>
                    <div class="form-field">
                        <label for="login__password">Password</label>
                        <div class="password-field">
                            <input autocomplete="current-password" id="login__password" type="password" name="password" placeholder="Your password" required aria-describedby="message_confirm capsLock">
                            <button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="login__password"><svg aria-hidden="true"><use href="#eye"/></svg></button>
                        </div>
                        <span id="capsLock" role="status" hidden>Caps Lock is on.</span>
                    </div>
                    <div id="confirmationField" class="form-field" hidden>
                        <label for="login__password_repeat">Confirm Password</label>
                        <div class="password-field">
                            <input autocomplete="new-password" id="login__password_repeat" type="password" name="password_confirmation" placeholder="Repeat your password" minlength="6" disabled aria-describedby="message_confirm capsLock">
                            <button id="toggleConfirmation" class="password-toggle" type="button" aria-label="Show confirmation password" aria-pressed="false" aria-controls="login__password_repeat"><svg aria-hidden="true"><use href="#eye"/></svg></button>
                        </div>
                    </div>
                    <p id="message_confirm" role="status" aria-live="polite"></p>
                    <button id="signIn" class="primary-button" type="submit"><span id="signInLabel">Enter the Hall</span><svg class="submit-compass" aria-hidden="true"><use href="#compass"/></svg></button>
                </form>
                <a id="authSwitch" class="account-link" href="/signup">Create an account <span aria-hidden="true">↗</span></a>
                <div class="demo-section" id="buttom_container"><button id="demo" class="demo-button" type="button"><svg aria-hidden="true"><use href="#compass"/></svg><span id="demoLabel">Try the Demo</span><span aria-hidden="true">→</span></button></div>
            </div>
            <div class="panel-foot" aria-hidden="true"><span></span><i></i><span></span></div>
        </section>
        <section class="stele-showcase" aria-label="Carved card stories">
            <div id="steleStage" class="stele-stage" data-renderer="fallback">
                <div class="stele-shadow" aria-hidden="true"></div>
                <canvas id="steleCanvas" aria-hidden="true"></canvas>
                <div id="stelePlane" class="stele-plane">
                    <button id="steleNext" class="stele-face" type="button" aria-label="Reveal the next carved card" aria-describedby="steleHint" disabled>
                        <span class="carving-image"><img id="stoneImage" src="/webpages/image_source/card/back.png?v=compass" alt="Carved card artwork"></span>
                        <span class="inscription-rule" aria-hidden="true">◇</span>
                        <span class="stone-story"><span id="stoneStory">The next story awaits.</span></span>
                        <span id="steleFlash" class="stele-flash" aria-hidden="true"></span>
                    </button>
                </div>
                <div id="steleHalo" class="stele-halo" aria-hidden="true"></div>
                <div id="fallbackSparks" class="fallback-sparks" aria-hidden="true"></div>
            </div>
            <p id="steleHint">Touch the stone to reveal another card.</p>
            <p id="galleryStatus" role="status"></p>
            <button id="retryCards" class="text-button" type="button" hidden>Reload Cards ↻</button>
        </section>
    </main>
    <footer class="login-footer"><a href="https://github.com/Caesar723" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></footer>
    <noscript><p class="script-notice">Enable JavaScript to sign in, create an account or play the demo.</p></noscript>
</body>
</html>
