
###########################
# Common
###########################

log_dir: "ppo/ppo_white_v0"
restore_step: 0
new_version: True
reward_type: "reward_creature_base"
sort_method: "score_tap"
#------------------------------------
action_history_length: 10
cards: "Elite Squire+Creature+2|Celestial Skyweaver+Creature+2|Pious Courser+Creature+3|Ironclad Crusader+Creature+2|Sunlit Priestess+Creature+3|Apocalypse Riders+Sorcery+4|Call to Unity+Sorcery+4|Angelic Blessing+Sorcery+2|Righteous Conviction+Sorcery+2|Spectral Embrace+Sorcery+3|Celestial Convergence+Instant+1|Avenging Light+Instant+1|Plains+Land+15"

#------------------------------------


###########################
#  Train 
###########################
seed: 1247
max_store: 1024
#------------------------------------
dataset_class_name: "game.rlearning.datasets.fixed_deck.ppo_agent_lstm.PPOAgentDataset"
dataloader:
  batch_size: 32
  num_workers: 0

dataset_multiple: 2


#------------------------------------
trainer: "game.rlearning.module.fixed_deck.ppo_agent_lstm.PPOTrainer"
reward_function: "game.rlearning.rewards.empty.get_reward"
state_function: "game.rlearning.states.fixed_deck.single_deck.get_state"
action_transform_function: "game.rlearning.actions.fixed_deck.single_deck.num2action"
action_mask_function: "game.rlearning.actions.fixed_deck.single_deck.create_action_mask"

w_val_loss: 0.5
w_act_loss: 0.5
w_kl_loss: 0.25
w_entropy_loss: 0.0

ppo:
  gamma: 0.99
  lambd: 0.95
  clip_para: 0.2
  clip_value_adv: 5.0
  



optimizer:
  learning_rate: 1.0e-7
  betas: [0.8, 0.99]
  eps: 1.0e-9 
  grad_clip_thresh: 1.0
  n_warmup_steps: 0

scheduler:
  step_size: 200
  gamma: 0.998

reset_epoch: False
reset_learning_rate: True
moving_average_beta: 0

#------------------------------------
total_step: 1000000
log_step: 20
eval_step: 4000
synthesis_step: 4000
synthesis_items: 20
save_step: 4000
epochs: 5
n_epoch: 7
###########################
#  Model 
###########################
shared_card_cfg: &shared_card_cfg
  max_card_id: 100
  max_card_type: 4

  card_special_types_len: 20
  card_cost_len: 6
  num_cards: 10

  max_mana: 20


  id_dim: 32
  type_dim: 16
  cat_emb_dim: 16
  mana_dim: 16
  cont_hidden: 32
  card_embed_dim: 128
  
  



model:

  
  HeroEmbedSelf:
    class_name: 'game.rlearning.net.fixed_deck.embed.HeroEmbed'
    len_life: 21
    embed_dim: 16
    

  HeroEmbedOppo:
    class_name: 'game.rlearning.net.fixed_deck.embed.HeroEmbed'
    len_life: 21
    embed_dim: 16

  ManaEmbed:
    class_name: 'game.rlearning.net.fixed_deck.embed.ManaEmbed'
    len_mana: 5
    embed_dim: 16
    max_mana: 20

  CardsHandEmbed:
    class_name: 'game.rlearning.net.fixed_deck.embed.HandEmbedNew'
    <<: *shared_card_cfg
    card_hand_dim: 160


  CardsBoardEmbedSelf:
    class_name: 'game.rlearning.net.fixed_deck.embed.BoardEmbed'
    <<: *shared_card_cfg


  CardsBoardEmbedOppo:
    class_name: 'game.rlearning.net.fixed_deck.embed.BoardEmbed'
    <<: *shared_card_cfg


  AttackerEmbed:
    class_name: 'game.rlearning.net.fixed_deck.embed.CardBoardEmbed'
    <<: *shared_card_cfg

  ActionEmbed:
    class_name: 'game.rlearning.net.fixed_deck.embed.ActionEmbed'
    action_dim: 1342
    action_embed_dim: 128
    is_g: False

  Dense:
    class_name: 'game.rlearning.net.common.baseNets.Dense'
    d_in: 16
    d_out: 560
    is_g: False

  HistoryEmbed:
    class_name: 'game.rlearning.net.fixed_deck.embed.HistoryEmbed'
    history_dim: 61
    history_embed_dim: 128
    

  Actor:
    class_name: 'game.rlearning.net.fixed_deck.ppo.Actor'
    input_dim: 688
    hidden_dim: 512
    output_dim: 1342
    deep: 5
  Critic:
    class_name: 'game.rlearning.net.fixed_deck.ppo.Critic'
    input_dim: 688
    hidden_dim: 512
    output_dim: 1
    deep: 5
  

    
