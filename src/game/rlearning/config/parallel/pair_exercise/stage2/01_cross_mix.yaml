# One deck from each of five different stage1 groups.
train_config:
  - game/rlearning/config/agents/pair_excercise/v1/01_ug_time_tempo.yaml
  - game/rlearning/config/agents/pair_excercise/v1/10_red_ralgar_midrange.yaml
  - game/rlearning/config/agents/pair_excercise/v1/17_green_combat_tricks.yaml
  - game/rlearning/config/agents/pair_excercise/v1/24_white_human_army.yaml
  - game/rlearning/config/agents/pair_excercise/v1/31_black_lifedrain_control.yaml

env: "game.rlearning.parallel_env.training_parallel_env_pair_exercise.Parallel_Env_Pair_Exercise"
info_communication: "game.rlearning.communicate.training_parallel_room.Info_Communication"
room: "game.rlearning.trainingRoom.training_parallel_room.Multi_Agent_Parallel_Room"
inference:
  max_batch_size: 32
  max_wait_ms: 5
  max_cached_policies: 8
rollout_torch_threads: 1
num_worker: 5
